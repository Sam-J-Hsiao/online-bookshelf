<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eceef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24272c" media="(prefers-color-scheme: dark)">
<title>閱讀誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261122060207">
<script type="module" src="js/app.js?v=20261122060207"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h9.5a3 3 0 013 3V20H8a3 3 0 01-3-3V4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 17a3 3 0 013-3h9.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4h12v16H6z M9 9h6M9 13h6M9 17h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 5h4v14h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 19.5c1.4-3.2 4-4.8 7-4.8s5.6 1.6 7 4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<header class="top">
  <a class="brand" href="./" aria-label="閱讀誌">
    <span class="brand-mark"><svg><use href="#i-book"/></svg></span>
    <span class="brand-name">閱讀誌</span>
  </a>
  <nav class="seg" aria-label="切換頁面">
    <button data-view="shelf" aria-pressed="true">書櫃</button>
    <button data-view="notes" aria-pressed="false">筆記</button>
    <button data-view="words" aria-pressed="false">單字本</button>
  </nav>
  <div class="top-actions">
    <button class="btn-round accent" id="addBtn" aria-label="新增書籍" title="新增書籍"><svg><use href="#i-plus"/></svg></button>
    <div id="who"></div>
  </div>
</header>

<main id="vShelf">
  <section class="shelf">
    <div class="toolbar">
      <div class="seg seg-sm" id="grouping" role="group" aria-label="切換中文書或英文書">
        <button data-g="zh" aria-pressed="true" title="使用中文圖書分類法">中文書<em></em></button>
        <button data-g="en" aria-pressed="false" title="使用杜威十進分類法">英文書<em></em></button>
      </div>
      <div class="rail" id="chips" role="group" aria-label="篩選分類"></div>
    </div>

    <div class="stage" id="stage">
      <div id="demoBar"></div>
      <div class="flow" id="flow" tabindex="0" aria-label="書架：用左右鍵、觸控板或拖曳翻書"></div>
      <div class="stage-msg" id="stageMsg"><div class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></div><p>正在打開你的書櫃</p></div>
    </div>

    <div class="flow-nav" id="flowNav" hidden>
      <button class="btn-round" id="prev" aria-label="上一本"><svg><use href="#i-left"/></svg></button>
      <div class="caption" id="cap" aria-live="polite"></div>
      <button class="btn-round" id="next" aria-label="下一本"><svg><use href="#i-right"/></svg></button>
    </div>
  </section>

  <section class="detail" id="detail"></section>
</main>

<main id="vNotes" hidden>
  <section class="page">
    <div class="page-head">
      <div><h1 class="serif">閱讀筆記</h1><p class="muted" id="nCount"></p></div>
      <label class="search"><svg><use href="#i-search"/></svg><input id="nSearch" type="search" placeholder="搜尋筆記內容或書名" aria-label="搜尋筆記" autocomplete="off"></label>
    </div>
    <div id="nList"></div>
  </section>
</main>

<main id="vManage" hidden>
  <section class="page">
    <div class="account" id="account"></div>
    <div class="page-head">
      <div><h1 class="serif">書籍管理</h1><p class="muted" id="mCount"></p></div>
      <div class="page-actions">
        <label class="check-all"><input type="checkbox" id="mAll"><i class="box" aria-hidden="true"></i>全選</label>
        <button class="btn danger-solid" id="mDelete" disabled>移除</button>
      </div>
    </div>
    <ul class="manage-list" id="mList"></ul>
  </section>
</main>

<main id="vWords" hidden>
  <section class="words">
    <div class="words-head">
      <div>
        <h1 class="serif">單字本</h1>
        <p class="muted" id="wCount"></p>
      </div>
      <div class="words-actions">
        <label class="select"><span class="sr">依書籍篩選</span><select id="wFilter"></select></label>
        <button class="btn" id="exportBtn"><svg><use href="#i-download"/></svg>匯出 CSV</button>
        <button class="btn accent" id="reviewBtn">開始複習</button>
      </div>
    </div>
    <div class="word-grid" id="wGrid"></div>
  </section>
</main>

<dialog id="dBook" class="sheet"><form id="fBook" novalidate></form></dialog>
<dialog id="dConfirm" class="sheet confirm"><form method="dialog">
  <h2 id="cTitle"></h2><p class="muted" id="cBody"></p>
  <div class="sheet-foot"><span class="grow"></span><button class="btn" value="no">取消</button><button class="btn danger-fill" value="yes" id="cOk">移除</button></div>
</form></dialog>
<dialog id="dRev" class="sheet review"><div id="rev"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
